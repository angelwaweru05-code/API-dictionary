<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class ="container">
        <div class="logo">API Wordly Dictionary </div>
    </header>
   <section class="hero-section" id="search-section">
    <h1>API Wordly Dictionary</h1>
    <p class="hero-p">search for  word to get its definition, and synonyms!</p>
    <form id="search-form">
        <input type="text" id="word-input" placeholder="Type a word here..." aria-label="Search for a word" required>
        <button type="submit" id="search-button">Search</button>
    </form>
   </section>
<section id="results-section">
    <div class="project-card">
        <h2 id="result-word">Word</h2>
        <p id="result-phonetic">/phonetic</p>
        <button id="audio-button">Play Pronunciation</button>
        <div class="word-meanings">
            <h3>Definitions</h3>
            <ul id="definition-list">
            </ul>
        </div>
        <div class="word-relations" id="synonyms-section">
            <h3>Synonyms</h3>
            <ul id="synonyms-list"></ul>
        </div>
        <div class="word-relations" id="antonyms-section">
            <h3>Antonyms</h3>
            <ul id="antonyms-list"></ul>
        </div>
    </div>
</section>

    <script src="index.js"></script>
</body>
</html>
